<body>
    <h1>css </h1> 
    <p>hola usuario hoy te voy a hacer 5 preguntas de css</p>
  <p>1. ¿como se conecta css con html?</p>
  <button onclick="responder(this, false)">con un DOCTYPE</button>
  <button onclick="responder(this, true)">con un link</button>
  <span></span>

  <p>2. ¿se puede abrir un live sever desde css?</p>
  <button onclick="responder(this, true)">no</button>
  <button onclick="responder(this, false)">si</button>
  <span></span>

  <p>3. ¿que es el css?</p>
  <button onclick="responder(this, true)">lo que modifica la estructura y color de html</button>
  <button onclick="responder(this, false)">lo que modifica la estructura y color de css</button>
  <span></span>

  <p>4. ¿se puede modificar el boton desde css?</p>
  <button onclick="responder(this, true)">si</button>
  <button onclick="responder(this, false)">no</button>
  <span></span>

  <p>5. ¿se puede alinear un texto desde css?</p>
  <button onclick="responder(this, false)">no</button>
  <button onclick="responder(this, true)">si</button>
  <span></span>
<h1></h1>
<button onclick="window.location.href='paginadinicio.html'">Ir a la página de inicio  de nuevo</button>

<script>
    function responder(boton, esCorrecto) {
      const mensaje = boton.parentElement.querySelectorAll("span")[
        Array.from(document.querySelectorAll("p")).indexOf(boton.previousElementSibling?.tagName === "P" ? boton.previousElementSibling : boton.previousElementSibling.previousElementSibling) - 1
      ];
      mensaje.textContent = esCorrecto ? " ¡Correcto!" : " Incorrecto"; 
    }
  </script>
